apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-aro1
  namespace: devspaces-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/marcusviniciusaso/devspaces-multicluster-openshift.git
    targetRevision: main
    path: openshift/aro1
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false      # essenciais: nunca removidos do cluster
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ServerSideDiff=true
