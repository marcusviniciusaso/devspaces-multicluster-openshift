# A instância cluster-scoped do OpenShift GitOps não recebe permissão em SCCs;
# este ClusterRole permite à Application openshift-<cluster> gerenciar as SCCs do Dev Spaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: devspaces-gitops-scc
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: devspaces-gitops-scc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: devspaces-gitops-scc
subjects:
  - kind: ServiceAccount
    name: devspaces-gitops-argocd-application-controller
    namespace: devspaces-gitops
