apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devspaces-aro3
  namespace: devspaces-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/marcusviniciusaso/devspaces-multicluster-openshift.git
    targetRevision: main
    path: devspaces/aro3
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true       # configuráveis: removidos do cluster ao sair do Git
      selfHeal: true
