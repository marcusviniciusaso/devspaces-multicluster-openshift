apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redirector-aro3
  namespace: devspaces-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/marcusviniciusaso/devspaces-multicluster-redirector.git
    targetRevision: main
    path: openshift/aro3
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
